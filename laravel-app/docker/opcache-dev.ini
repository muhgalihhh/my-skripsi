; OPcache Development Config
; File ini dipakai saat development supaya setiap edit PHP/Blade langsung terlihat
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; KUNCI: validate_timestamps=1 + revalidate_freq=0
; Artinya PHP SELALU cek apakah file berubah setiap request
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1
