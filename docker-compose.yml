# ============================================
# Docker Compose - Topic Modeling Skripsi
# ============================================
# Laravel (Web App) + FastAPI (ML Microservice) + MySQL
# Mode: Production
#
# Quick Start:
#   docker compose up -d --build
#   docker compose logs -f
#
# URLs:
#   Laravel      : http://localhost:8080
#   FastAPI      : http://localhost:8000
#   FastAPI Docs : http://localhost:8000/docs
#
# Stop:
#   docker compose down
#
# Clean all (data juga dihapus):
#   docker compose down -v

services:
  # ============================================
  # Reverse Proxy (Nginx + Let's Encrypt)
  # ============================================
  reverse-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: skripsi-reverse-proxy
    ports:
      - '${PROXY_BIND_IP:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_BIND_IP:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - proxy-certs:/etc/nginx/certs:rw
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - skripsi-net
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: skripsi-reverse-proxy-acme
    depends_on:
      reverse-proxy:
        condition: service_started
    environment:
      - NGINX_PROXY_CONTAINER=skripsi-reverse-proxy
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-galihslank79@gmail.com}
    volumes:
      - proxy-certs:/etc/nginx/certs:rw
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - skripsi-net
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================
  # MySQL 8.4 - Database
  # ============================================
  mysql:
    image: mysql:8.4
    container_name: skripsi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-rootpassword}'
      MYSQL_DATABASE: '${MYSQL_DATABASE:-skripsi_db}'
      MYSQL_USER: '${MYSQL_USER:-skripsi}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD:-skripsi_password}'
    ports:
      - '${MYSQL_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - skripsi-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================
  # FastAPI - ML & Scraping Microservice
  # ============================================
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: skripsi-fastapi
    ports:
      - '${FASTAPI_BIND_IP:-127.0.0.1}:${FASTAPI_PORT:-8000}:8000'
    volumes:
      - fastapi-data:/app/data
      - ./fastapi/data/results/artifacts_tuning:/app/data/results/artifacts_tuning
      - fastapi-models:/app/app/ml/trained_models
      - fastapi-logs:/app/logs
    env_file:
      - '${FASTAPI_ENV_FILE:-./fastapi/.env}'
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://laravel:8080}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-skripsi_db}
      - DB_USERNAME=${MYSQL_USER:-skripsi}
      - DB_PASSWORD=${MYSQL_PASSWORD:-skripsi_password}
      - NUMBA_CACHE_DIR=/tmp
    networks:
      - skripsi-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', '-m', '5', 'http://localhost:8000/api/v1/health']
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================
  # Laravel - Web Application (PHP-FPM + Nginx)
  # ============================================
  laravel:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: skripsi-laravel
    ports:
      - '${LARAVEL_BIND_IP:-0.0.0.0}:${LARAVEL_PORT:-8080}:8080'
    volumes:
      - laravel-storage:/var/www/html/storage
    env_file:
      - '${LARAVEL_ENV_FILE:-./laravel-app/.env}'
    environment:
      - APP_NAME=TopicModeling
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-skripsi_db}
      - DB_USERNAME=${MYSQL_USER:-skripsi}
      - DB_PASSWORD=${MYSQL_PASSWORD:-skripsi_password}
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FASTAPI_BASE_URL=http://fastapi:8000
      - VIRTUAL_HOST=${PUBLIC_DOMAIN:-localhost}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${PUBLIC_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@example.com}
    depends_on:
      mysql:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      reverse-proxy:
        condition: service_started
    networks:
      - skripsi-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', '-L', 'http://localhost:8080/login']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

# ============================================
# Networks
# ============================================
networks:
  skripsi-net:
    driver: bridge

# ============================================
# Volumes (persistent data)
# ============================================
volumes:
  mysql-data:
  fastapi-data:
  fastapi-models:
  fastapi-logs:
  laravel-storage:
  proxy-certs:
  proxy-vhost:
  proxy-html:
